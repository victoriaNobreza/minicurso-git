<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu cartão</title>
  <style>
    :root {
      --destaque: #B0451F;   /* troque esta cor! */
      --fundo: #F7F3EA;
      --cartao: #FFFDF8;
      --texto: #1F2328;
      --suave: #6B665D;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--fundo);
      color: var(--texto);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    .cartao {
      width: 100%;
      max-width: 440px;
      padding: 40px 32px;
      background: var(--cartao);
      border: 1px solid #E2DBCC;
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(31, 35, 40, 0.08);
      text-align: center;
    }
    .avatar {
      width: 88px;
      height: 88px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--destaque);
      color: #FFFFFF;
      font-size: 32px;
      font-weight: 700;
    }
    h1 { font-size: 28px; }
    .curso { margin-top: 4px; color: var(--destaque); font-weight: 600; }
    .bio { margin: 16px 0 24px; color: var(--suave); line-height: 1.6; }
    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      list-style: none;
    }
    .tags li {
      padding: 6px 14px;
      border: 1px solid var(--destaque);
      border-radius: 999px;
      color: var(--destaque);
      font-size: 14px;
    }
    .terminal {
      margin-top: 28px;
      padding: 14px 16px;
      border-radius: 10px;
      background: var(--texto);
      color: #F7F3EA;
      font-family: Consolas, "Courier New", monospace;
      font-size: 14px;
      text-align: left;
    }
    .terminal span { color: #7EE787; }
    .botao {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 24px;
      border-radius: 999px;
      background: var(--destaque);
      color: #FFFFFF;
      font-weight: 600;
      text-decoration: none;
    }
    .botao:hover { opacity: 0.9; }
    footer { margin-top: 24px; color: var(--suave); font-size: 12px; }
  </style>
</head>
<body>
  <main class="cartao">
    <div class="avatar">SN</div>
    <h1>Seu Nome</h1>
    <p class="curso">ADS · 1º semestre</p>
    <p class="bio">Estou aprendendo Git e GitHub para nunca mais perder código.</p>
    <ul class="tags">
      <li>Python</li>
      <li>Games</li>
      <li>Café</li>
    </ul>
    <div class="terminal"><span>$</span> git commit -m "minha primeira página"</div>
    <a class="botao" href="projetos.html">Ver meus projetos →</a>
    <footer>Feito no minicurso de Git e GitHub · Semana da Tecnologia</footer>
  </main>
</body>
</html>
